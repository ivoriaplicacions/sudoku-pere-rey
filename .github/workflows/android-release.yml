name: Android Release

# Builds the signed AAB that goes to Play. Kept out of the per-commit CI so the
# keystore is only ever restored on a deliberate release run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify puzzles
        run: npm run puzzles:verify

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the four ANDROID_* secrets before releasing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/maestros-release.jks
          umask 077
          cat > android/keystore.properties <<EOF
          storeFile=maestros-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Remove keystore from the runner
        if: always()
        run: rm -f android/maestros-release.jks android/keystore.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
