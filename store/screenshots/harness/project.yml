name: Harness
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6VQVGXVTKQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivoriaplicacions.harness.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    settings:
      base:
        TEST_TARGET_NAME: Host
        PRODUCT_BUNDLE_IDENTIFIER: com.ivoriaplicacions.harness.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UITests:
    build:
      targets:
        UITests: [test]
    test:
      targets: [UITests]
